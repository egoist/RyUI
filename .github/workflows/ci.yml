name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: CGO_ENABLED=0 go build ./... && go vet ./...
      - run: go test ./...
      - run: go test -tags ryui_debug ./signal
      - name: generated files are up to date
        run: go generate ./ops && git diff --exit-code
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: swift test --package-path hosts/ios
      - name: the app builds for the simulator
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          CC=$(xcrun --sdk iphonesimulator --find clang)
          F="-isysroot $SDK -target arm64-apple-ios16.0-simulator"
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 CC=$CC CGO_CFLAGS="$F" CGO_LDFLAGS="$F" \
            go build -tags ios -buildmode=c-archive -o /tmp/libryui.a ./examples/counter
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools } # its default asks for "tools", which the SDK no longer has
      - name: the Kotlin decoder agrees with the golden files; the shell app builds
        working-directory: hosts/android
        run: ./gradlew :ryui:testDebugUnitTest :app:assembleDebug
      - name: the app builds for Android
        run: |
          NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -1)
          if [ -z "$NDK" ]; then sdkmanager "ndk;27.1.12297006"; NDK=$ANDROID_HOME/ndk/27.1.12297006; fi
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang \
            CGO_LDFLAGS="-Wl,-z,max-page-size=16384" go build -buildmode=c-shared -o /tmp/libryui.so ./examples/counter
  # GUI tests: the examples on a simulator and an emulator, driven
  # through the debug hosts' automation (e2e/).
  e2e-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go test -tags e2e ./e2e -run IOS -v
  e2e-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools } # its default asks for "tools", which the SDK no longer has
      - name: an NDK
        run: ls -d $ANDROID_HOME/ndk/* 2>/dev/null || sdkmanager "ndk;27.1.12297006"
      - name: KVM, for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: go test -tags e2e ./e2e -run Android -v
